environment:
  autoDeploy: true
  defaultServices:
    - name: 'api'
    - name: 'worker'

services:
  - name: 'api'
    requires:
      - name: 'kv'
      - name: 'state'
    github:
      repository: 'vigneshrajsb/lifecycle-repoless-fixture'
      branchName: 'trunk'
      docker:
        builder:
          engine: 'buildkit'
        defaultTag: 'trunk'
        app:
          dockerfilePath: 'Dockerfile'
          ports:
            - 8080
          env:
            SERVICE: 'api'
            KV_HOST: '{{kv_internalHostname}}'
            KV_BRANCH: '{{kv_branchName}}'
            STATE_HOST: '{{state_internalHostname}}'
      deployment:
        public: false
        readiness:
          tcpSocketPort: 8080

  - name: 'worker'
    requires:
      - name: 'wkv'
    github:
      repository: 'vigneshrajsb/lifecycle-repoless-fixture'
      branchName: 'trunk'
      docker:
        builder:
          engine: 'buildkit'
        defaultTag: 'trunk'
        app:
          dockerfilePath: 'Dockerfile'
          ports:
            - 8080
          env:
            SERVICE: 'worker'
            WKV_HOST: '{{wkv_internalHostname}}'
      deployment:
        public: false
        readiness:
          tcpSocketPort: 8080

  - name: 'kv'
    docker:
      dockerImage: 'redis'
      defaultTag: '7.2-alpine'
      ports:
        - 6379
      env:
        PARENT_HOST: '{{api_internalHostname}}'
      deployment:
        public: false
        readiness:
          tcpSocketPort: 6379

  - name: 'state'
    docker:
      dockerImage: 'redis'
      defaultTag: '7.2-alpine'
      command: 'redis-server'
      arguments: '--appendonly%%SPLIT%%yes%%SPLIT%%--dir%%SPLIT%%/data'
      ports:
        - 6379
      deployment:
        public: false
        readiness:
          tcpSocketPort: 6379
        serviceDisks:
          - name: 'data'
            mountPath: '/data'
            storageSize: '1Gi'

  - name: 'wkv'
    docker:
      dockerImage: 'redis'
      defaultTag: '7.2-alpine'
      ports:
        - 6379
      deployment:
        public: false
        readiness:
          tcpSocketPort: 6379
