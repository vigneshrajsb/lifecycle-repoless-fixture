environment:
  autoDeploy: true
  defaultServices:
    - name: 'api'
    - name: 'worker'

services:
  - name: 'api'
    github:
      repository: 'vigneshrajsb/lifecycle-repoless-fixture'
      branchName: 'trunk'
      docker:
        builder:
          engine: 'buildkit'
        defaultTag: 'trunk'
        app:
          dockerfilePath: 'Dockerfile'
          ports:
            - 8080
          env:
            SERVICE: 'api'
      deployment:
        public: false
        readiness:
          tcpSocketPort: 8080

  - name: 'worker'
    github:
      repository: 'vigneshrajsb/lifecycle-repoless-fixture'
      branchName: 'trunk'
      docker:
        builder:
          engine: 'buildkit'
        defaultTag: 'trunk'
        app:
          dockerfilePath: 'Dockerfile'
          ports:
            - 8080
          env:
            SERVICE: 'worker'
      deployment:
        public: false
        readiness:
          tcpSocketPort: 8080
